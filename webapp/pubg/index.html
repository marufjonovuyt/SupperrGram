<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Pubg UC olish</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg: var(--tg-theme-bg-color, #0e0e13);
    --text: var(--tg-theme-text-color, #ffffff);
    --hint: var(--tg-theme-hint-color, #8b8b95);
    --btn: var(--tg-theme-button-color, #2ea6ff);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --card: var(--tg-theme-secondary-bg-color, #1c1c24);
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text);
  }
  h1{font-size:20px; margin:4px 0 16px; display:flex; align-items:center; gap:8px}
  .card{background:var(--card); border-radius:16px; padding:16px; margin-bottom:14px}
  label{font-size:13px; color:var(--hint); display:block; margin-bottom:6px}
  input{
    width:100%; padding:14px; border-radius:12px; border:none; background:#000000aa;
    color:var(--text); font-size:16px; outline:none;
  }
  .row{display:flex; gap:8px; margin-top:10px}
  button{
    border:none; border-radius:12px; padding:14px 16px; font-size:15px; font-weight:600;
    cursor:pointer; background:var(--btn); color:var(--btn-text); flex:1;
  }
  button:disabled{opacity:.5}
  .status{font-size:14px; margin-top:10px; min-height:18px}
  .ok{color:#3ddc84}
  .err{color:#ff5a5a}
  .product{
    display:flex; justify-content:space-between; align-items:center;
    background:#000000aa; border-radius:12px; padding:14px; margin-bottom:8px; cursor:pointer;
    border:2px solid transparent;
  }
  .product.selected{border-color:var(--btn)}
  .product .name{font-weight:600}
  .product .price{color:var(--btn); font-weight:700}
  #productsWrap{display:none}
  #confirmBtn{display:none; margin-top:14px; width:100%}
</style>
</head>
<body>
  <h1>🎮 Pubg UC olish</h1>

  <div class="card">
    <label>PUBG Mobile Player ID</label>
    <input id="playerId" inputmode="numeric" placeholder="Masalan: 512345678">
    <div class="row">
      <button id="checkBtn" onclick="checkId()">🔍 Tekshirish</button>
    </div>
    <div class="status" id="idStatus"></div>
  </div>

  <div class="card" id="productsWrap">
    <label>Kerakli paketni tanlang</label>
    <div id="productsList"></div>
  </div>

  <button id="confirmBtn" onclick="confirmOrder()">✅ Tasdiqlash va yuborish</button>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.ready(); tg.expand(); }

    let playerName = null;
    let selectedProduct = null;

    // Python FastAPI Server Manzili
    const API_BASE = 'https://c578.coresuz.ru';

    async function checkId() {
      const id = document.getElementById('playerId').value.trim();
      const statusEl = document.getElementById('idStatus');
      if (!/^\d{6,15}$/.test(id)) {
        statusEl.innerHTML = '<span class="err">❗️ ID faqat raqamlardan iborat bo\'lishi kerak</span>';
        return;
      }
      statusEl.textContent = '⏳ Tekshirilmoqda...';
      document.getElementById('checkBtn').disabled = true;
      try {
        // PYTHON FASTAPI ENDPOINTIGA SO'ROV YUBORILMOQDA
        const res = await fetch(`${API_BASE}/api/pubg/validate?player_id=${encodeURIComponent(id)}`);
        const data = await res.json();
        if (data.ok) {
          playerName = data.player_name;
          statusEl.innerHTML = '<span class="ok">✅ Topildi: ' + playerName + '</span>';
          loadProducts();
        } else {
          statusEl.innerHTML = '<span class="err">❌ ' + (data.message || 'ID topilmadi') + '</span>';
        }
      } catch (e) {
        statusEl.innerHTML = '<span class="err">❌ Server xatosi</span>';
      }
      document.getElementById('checkBtn').disabled = false;
    }

    async function loadProducts() {
      // PYTHON FASTAPI ENDPOINTIGA SO'ROV YUBORILMOQDA
      const res = await fetch(`${API_BASE}/api/pubg/products`);
      const data = await res.json();
      const wrap = document.getElementById('productsWrap');
      const list = document.getElementById('productsList');
      list.innerHTML = '';
      if (data.ok && data.products.length) {
        data.products.forEach(p => {
          const div = document.createElement('div');
          div.className = 'product';
          div.innerHTML = `<span class="name">${p.name}</span><span class="price">${Number(p.sell_price_uzs).toLocaleString('ru-RU')} so'm</span>`;
          div.onclick = () => selectProduct(p, div);
          list.appendChild(div);
        });
        wrap.style.display = 'block';
      } else {
        list.innerHTML = '<div class="err">Hozircha paketlar mavjud emas</div>';
        wrap.style.display = 'block';
      }
    }

    function selectProduct(p, el) {
      document.querySelectorAll('.product').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
      selectedProduct = p;
      document.getElementById('confirmBtn').style.display = 'block';
    }

    function confirmOrder() {
      if (!selectedProduct) return;
      const id = document.getElementById('playerId').value.trim();
      const payload = {
        player_id: id,
        player_name: playerName || id,
        product_id: selectedProduct.product_id
      };
      if (tg) {
        tg.sendData(JSON.stringify(payload));
        tg.close();
      } else {
        alert('Bu sahifa faqat Telegram ichida ishlaydi.');
      }
    }
  </script>
</body>
</html>
